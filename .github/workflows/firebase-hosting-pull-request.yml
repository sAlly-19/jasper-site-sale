name: Site and Worker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: demo-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-jasper-audit.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-jasper-audit
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-jasper-audit.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      EXPO_PUBLIC_JASPER_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run scan:secrets
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: node --test test/dependency-compat.test.mjs
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npm run db:migrate:local
        working-directory: worker
      - run: npm run test:rules
      - run: npm run build:web
      - run: npm run audit:runtime
      - run: npm run audit:runtime
        working-directory: worker
      - name: Generate security metadata
        shell: bash
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application > "${RUNNER_TEMP}/jasper-site-sbom.cdx.json"
          (cd worker && npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application) > "${RUNNER_TEMP}/jasper-worker-sbom.cdx.json"
          npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --json --out "${RUNNER_TEMP}/jasper-site-licenses.json"
          (cd worker && npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --json --out "${RUNNER_TEMP}/jasper-worker-licenses.json")
      - name: Visual smoke test
        shell: bash
        run: |
          npm run preview:dist > "${RUNNER_TEMP}/jasper-site.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npm run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jasper-site-visual-smoke
          path: /tmp/jasper-site-*-qa.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jasper-site-security-metadata
          path: |
            ${{ runner.temp }}/jasper-site-sbom.cdx.json
            ${{ runner.temp }}/jasper-worker-sbom.cdx.json
            ${{ runner.temp }}/jasper-site-licenses.json
            ${{ runner.temp }}/jasper-worker-licenses.json
          if-no-files-found: error
          retention-days: 30

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Semgrep CE
        run: python3 -m pip install --disable-pip-version-check semgrep==1.178.0
      - name: Run Semgrep CE
        run: semgrep scan --config p/typescript --config p/javascript --error --metrics off --json --output semgrep-site.json --exclude node_modules --exclude dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jasper-site-semgrep
          path: semgrep-site.json
          if-no-files-found: warn
          retention-days: 30
